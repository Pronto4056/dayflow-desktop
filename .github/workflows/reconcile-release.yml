name: Sync DayFlow 1.0.0 release notes

on:
  push:
    branches: [main]
    paths:
      - docs/RELEASE-V1.0.0.md
      - .github/workflows/reconcile-release.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: dayflow-release-notes
  cancel-in-progress: false

jobs:
  update-notes:
    if: github.repository == 'Pronto4056/dayflow-desktop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Update the existing release body only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          assert repository == 'Pronto4056/dayflow-desktop'
          api = 'https://api.github.com/repos/' + repository
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def request(url, method='GET', payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          file = request(api + '/contents/docs/RELEASE-V1.0.0.md?ref=' + os.environ['GITHUB_SHA'])
          assert file['encoding'] == 'base64'
          notes = base64.b64decode(file['content']).decode('utf-8')
          release = request(api + '/releases/tags/V1.0.0')
          assert release['tag_name'] == 'V1.0.0' and not release['draft']
          installer = next(a for a in release['assets'] if a['name'] == 'DayFlow-Setup-1.0.0.exe')
          assert installer['digest'] == 'sha256:7d35283ec269e7436a5c2ca72cb1533c60dad311f676d7fc49e6967e31b8af0d'
          before = [(a['id'], a['name'], a['size'], a.get('digest')) for a in release['assets']]
          updated = request(api + '/releases/' + str(release['id']), 'PATCH', {'body': notes})
          after = [(a['id'], a['name'], a['size'], a.get('digest')) for a in updated['assets']]
          assert updated['body'] == notes and updated['tag_name'] == release['tag_name']
          assert before == after, 'Release assets must remain unchanged'
          print('DayFlow 1.0.0 release notes updated; tag and assets unchanged.')
          PY
